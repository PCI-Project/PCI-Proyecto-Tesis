  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        /* New 5-color palette */
        --color-primary: 54 200 200; /* #36C8C8 Teal */
        --color-primary-dark: 40 150 150; /* Darker Teal */

        --color-secondary: 155 193 188; /* #9BC1BC Opal */
        --color-secondary-dark: 120 150 145;

        --color-accent: 244 241 187; /* #F4F1BB Pale Spring Bud */
        --color-accent-text: 80 75 30;

        --color-danger: 237 106 90; /* #ED6A5A Terra Cotta */
        --color-danger-dark: 190 80 70;

        --color-bg-base: 230 235 224; /* #E6EBE0 Alabaster */
        --color-bg-surface: 247 249 244; /* Lighter off-white */

        --color-text-base: 29 35 42;
        --color-text-muted: 107 114 128;
        --color-text-inverted: 255 255 255;

        --color-border-base: 209 213 219;
        --color-border-muted: 229 231 235;
      }
      .dark:root {
        --color-primary: 54 200 200;
        --color-primary-dark: 40 150 150;

        --color-secondary: 120 160 155;
        --color-secondary-dark: 100 130 125;

        --color-accent: 244 241 187;
        --color-accent-text: 80 75 30;

        --color-danger: 239 120 100;
        --color-danger-dark: 200 90 80;

        --color-bg-base: 20 24 30;
        --color-bg-surface: 30 36 44;

        --color-text-base: 230 235 224;
        --color-text-muted: 156 163 175;
        --color-text-inverted: 20 24 30;

        --color-border-base: 48 56 68;
        --color-border-muted: 60 70 82;
      }
      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-mono {
        font-family: "IBM Plex Mono", monospace;
      }
      /* Custom modal animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scaleIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .modal-enter {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .modal-content-enter {
        animation: scaleIn 0.3s ease-out forwards;
      }
      @keyframes simpleFadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-simple-fade-in {
        animation: simpleFadeIn 0.3s ease-out forwards;
      }
      /* Hide scrollbar for clean mobile look */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
    </style>
    <script>

              "bg-base": "rgb(var(--color-bg-base) / <alpha-value>)",
              "bg-surface": "rgb(var(--color-bg-surface) / <alpha-value>)",
              "text-base": "rgb(var(--color-text-base) / <alpha-value>)",
              "text-muted": "rgb(var(--color-text-muted) / <alpha-value>)",
              "text-inverted":
                "rgb(var(--color-text-inverted) / <alpha-value>)",
              "border-base": "rgb(var(--color-border-base) / <alpha-value>)",
              "border-muted": "rgb(var(--color-border-muted) / <alpha-value>)",
            },
          },
        },
      };
    </script>
