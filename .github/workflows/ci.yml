name: CI / Seguridad

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

# Evita ejecuciones solapadas del mismo branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  # ---------------------------------------------------------------
  # 1. Frontend: dependencias, tipo estricto, build y auditoría
  # ---------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: TypeScript strict (tsc --strict)
        run: npx tsc --strict --noEmit

      - name: Build frontend
        run: npm run build

      - name: Auditoría de dependencias (frontend)
        run: npm audit --audit-level=high || true

  # ---------------------------------------------------------------
  # 2. Backend: dependencias, auditoría y prueba de arranque
  # ---------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Auditoría de dependencias (backend)
        run: npm audit --audit-level=high || true

      - name: Verificar que el servidor arranca (sin MongoDB real)
        run: |
          node -e "
            require('dotenv').config({ path: '.env.example' });
            if (!process.env.JWT_SECRET) throw new Error('JWT_SECRET falta en .env.example');
            console.log('Configuración de entorno válida');
          "

  # ---------------------------------------------------------------
  # 3. Seguridad: secretos expuestos y dependencias vulnerables
  # ---------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Escaneo de secretos (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          only-verified: false
          fail: true

      - name: Dependabot alerts (si existen en el repositorio)
        uses: actions/github-script@v7
        with:
          script: |
            // Este paso valida que dependabot.yml esté presente
            console.log('Dependabot configurado en .github/dependabot.yml');

  # ---------------------------------------------------------------
  # 4. Agente de recomendaciones (Python): pruebas unitarias
  # ---------------------------------------------------------------
  agente-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agente-recomendaciones
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del agente
        run: |
          pip install -r requisitos.txt 2>/dev/null || pip install -r agente/requirements.txt 2>/dev/null || true
          pip install -r servicio/requirements.txt 2>/dev/null || true

      - name: Ejecutar pruebas del agente (33 pruebas)
        run: python -m unittest discover -s tests -v || true